<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem ve Sohbet</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-between">

    <!-- NAVBAR -->
    <header class="bg-gray-800 p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold text-yellow-400">Sistem</h1>
        <div id="userMenu" class="hidden flex items-center gap-4">
            <span class="text-sm">Kullanıcı: <strong id="usernameDisplay"></strong></span>
            <span class="text-sm">Bakiye: <strong id="userBalance" class="text-green-400">0</strong> TL</span>
            <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm transition">Çıkış Yap</button>
        </div>
    </header>

    <!-- ANA İÇERİK -->
    <main class="flex-grow flex items-center justify-center p-4">
        
        <!-- GİRİŞ / KAYIT KUTUSU -->
        <div id="authContainer" class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-md">
            <h2 id="authTitle" class="text-2xl font-bold mb-6 text-center text-yellow-400">Giriş Yap</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Kullanıcı Adı</label>
                    <input type="text" id="authUsername" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-yellow-400" placeholder="Kullanıcı adını gir">
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-1">Şifre</label>
                    <input type="password" id="authPassword" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-yellow-400" placeholder="Şifreni gir">
                </div>

                <!-- Kayıt Ol Ek Alanları -->
                <div id="registerFields" class="hidden space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Güvenlik Sorusu</label>
                        <input type="text" id="secQuestion" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-yellow-400" placeholder="Örn: İlk evcil hayvanının adı?">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Güvenlik Sorusu Cevabı</label>
                        <input type="text" id="secAnswer" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-yellow-400" placeholder="Cevabın">
                    </div>
                </div>

                <button onclick="handleAuthSubmit()" id="authSubmitBtn" class="w-full bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2 rounded transition">
                    Giriş Yap
                </button>

                <!-- Mod Geçişleri -->
                <div class="flex justify-between text-sm mt-4">
                    <button onclick="toggleAuthMode('login')" class="text-gray-400 hover:text-white underline">Giriş Yap</button>
                    <button onclick="toggleAuthMode('register')" class="text-gray-400 hover:text-white underline">Kayıt Ol</button>
                    <button onclick="toggleAuthMode('forgot')" class="text-gray-400 hover:text-white underline">Şifremi Unuttum</button>
                </div>
            </div>
        </div>

        <!-- BAŞARILI GİRİŞ VE SOHBET EKRANI -->
        <div id="gameContainer" class="hidden w-full max-w-2xl bg-gray-800 p-6 rounded-xl shadow-lg flex flex-col h-[500px]">
            <h2 class="text-2xl font-bold mb-4 text-yellow-400 border-b border-gray-700 pb-2">Genel Sohbet Odası</h2>
            
            <!-- Mesajların Listelendiği Alan -->
            <div id="chatMessages" class="flex-grow overflow-y-auto bg-gray-900 p-4 rounded-lg mb-4 space-y-3 border border-gray-700">
                <!-- Mesajlar buraya gelecek -->
            </div>

            <!-- Mesaj Gönderme Formu -->
            <div class="flex gap-2">
                <input type="text" id="chatInput" onkeypress="handleChatKeyPress(event)" class="flex-grow bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-yellow-400" placeholder="Mesajınızı yazın...">
                <button onclick="sendChatMessage()" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold px-5 py-2 rounded transition">Gönder</button>
            </div>
        </div>

    </main>

    <!-- JAVASCRIPT -->
    <script>
        let currentAuthMode = 'login';
        let currentUsername = localStorage.getItem('username') || '';
        let chatInterval = null;

        window.addEventListener('DOMContentLoaded', () => {
            if (currentUsername) {
                checkUserSession();
            }
        });

        function toggleAuthMode(mode) {
            currentAuthMode = mode;
            const authTitle = document.getElementById('authTitle');
            const authSubmitBtn = document.getElementById('authSubmitBtn');
            const registerFields = document.getElementById('registerFields');

            if (mode === 'login') {
                authTitle.innerText = 'Giriş Yap';
                authSubmitBtn.innerText = 'Giriş Yap';
                registerFields.classList.add('hidden');
            } else if (mode === 'register') {
                authTitle.innerText = 'Kayıt Ol';
                authSubmitBtn.innerText = 'Kayıt Ol';
                registerFields.classList.remove('hidden');
            } else if (mode === 'forgot') {
                authTitle.innerText = 'Şifremi Unuttum';
                authSubmitBtn.innerText = 'Güvenlik Sorusunu Getir';
                registerFields.classList.add('hidden');
            }
        }

        async function handleAuthSubmit() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();

            if (!username) return alert('Kullanıcı adı boş olamaz!');

            if (currentAuthMode === 'login') {
                if (!password) return alert('Şifre boş olamaz!');
                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error);

                    localStorage.setItem('username', data.username);
                    currentUsername = data.username;
                    alert('Giriş başarılı!');
                    location.reload();
                } catch (err) {
                    alert(err.message);
                }
            } else if (currentAuthMode === 'register') {
                if (!password) return alert('Şifre boş olamaz!');
                const securityQuestion = document.getElementById('secQuestion').value.trim();
                const securityAnswer = document.getElementById('secAnswer').value.trim();

                try {
                    const res = await fetch('/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password, securityQuestion, securityAnswer })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error);

                    alert('Kayıt başarılı! Giriş yapabilirsiniz.');
                    toggleAuthMode('login');
                } catch (err) {
                    alert(err.message);
                }
            } else if (currentAuthMode === 'forgot') {
                try {
                    const res = await fetch(`/api/get-security-question?username=${encodeURIComponent(username)}`);
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error);

                    const answer = prompt(`Güvenlik Sorusu: ${data.question}\nCevabını gir:`);
                    if (!answer) return;

                    const newPassword = prompt('Yeni şifreni gir:');
                    if (!newPassword) return;

                    const resetRes = await fetch('/api/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, answer, newPassword })
                    });
                    const resetData = await resetRes.json();
                    if (!resetRes.ok) throw new Error(resetData.error);

                    alert('Şifre başarıyla değiştirildi!');
                    toggleAuthMode('login');
                } catch (err) {
                    alert(err.message);
                }
            }
        }

        async function checkUserSession() {
            try {
                const res = await fetch(`/api/user?username=${encodeURIComponent(currentUsername)}`);
                const data = await res.json();
                if (res.ok && data.user) {
                    document.getElementById('usernameDisplay').innerText = currentUsername;
                    document.getElementById('userBalance').innerText = data.user.balance || 0;
                    
                    document.getElementById('authContainer').classList.add('hidden');
                    document.getElementById('userMenu').classList.remove('hidden');
                    document.getElementById('gameContainer').classList.remove('hidden');

                    fetchMessages();
                    chatInterval = setInterval(fetchMessages, 3000);
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function fetchMessages() {
            try {
                const res = await fetch('/api/chat/messages');
                const data = await res.json();
                if (res.ok) {
                    const chatContainer = document.getElementById('chatMessages');
                    chatContainer.innerHTML = '';
                    data.messages.forEach(msg => {
                        const div = document.createElement('div');
                        div.className = 'bg-gray-800 p-2 rounded shadow text-sm';
                        if (msg.isAdmin) {
                            div.innerHTML = `<strong class="text-red-400 bg-red-900/40 px-1 rounded">🛡️ ${msg.username}:</strong> <span class="text-yellow-200 font-bold">${msg.text}</span>`;
                        } else {
                            div.innerHTML = `<strong class="text-yellow-400">${msg.username}:</strong> <span class="text-gray-200">${msg.text}</span>`;
                        }
                        chatContainer.appendChild(div);
                    });
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            } catch (err) {
                console.error('Mesajlar alınamadı:', err);
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            try {
                const res = await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUsername, text })
                });
                if (res.ok) {
                    input.value = '';
                    fetchMessages();
                }
            } catch (err) {
                alert('Mesaj gönderilemedi!');
            }
        }

        function handleChatKeyPress(event) {
            if (event.key === 'Enter') {
                sendChatMessage();
            }
        }

        function handleLogout() {
            if (chatInterval) clearInterval(chatInterval);
            localStorage.removeItem('username');
            location.reload();
        }
    </script>
</body>
</html>
