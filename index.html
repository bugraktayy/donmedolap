<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Rulet Oyunu</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-between">

    <!-- ÜST MENÜ / NAVBAR -->
    <header class="bg-gray-800 p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold text-yellow-400">Rulet Oyunu</h1>
        <div id="userMenu" class="hidden flex items-center gap-4">
            <span class="text-sm">Kullanıcı: <strong id="usernameDisplay"></strong></span>
            <span class="text-sm">Bakiye: <strong id="userBalance" class="text-green-400">0</strong> TL</span>
            <!-- Para Yatırma Butonu -->
            <button onclick="openDepositModal()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded font-bold text-sm transition">
                + Para Yatır
            </button>
            <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm transition">
                Çıkış Yap
            </button>
        </div>
    </header>

    <!-- ANA İÇERİK / GİRİŞ & OYUN ALANI -->
    <main class="flex-grow flex items-center justify-center p-4">
        
        <!-- 1. GİRİŞ / KAYIT / ŞİFREMİ UNUTTUM KUTUSU -->
        <div id="authContainer" class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-md">
            <h2 id="authTitle" class="text-2xl font-bold mb-6 text-center text-yellow-400">Giriş Yap</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Kullanıcı Adı</label>
                    <input type="text" id="authUsername" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-yellow-400 text-white" placeholder="Kullanıcı adınızı girin">
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-1">Şifre</label>
                    <input type="password" id="authPassword" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-yellow-400 text-white" placeholder="Şifrenizi girin">
                </div>

                <!-- Kayıt Olurken Çıkacak Ek Alanlar -->
                <div id="registerFields" class="hidden space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Güvenlik Sorusu</label>
                        <input type="text" id="secQuestion" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-yellow-400 text-white" placeholder="Örn: İlk evcil hayvanınızın adı?">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Güvenlik Sorusu Cevabı</label>
                        <input type="text" id="secAnswer" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-yellow-400 text-white" placeholder="Cevabınız">
                    </div>
                </div>

                <button onclick="handleAuthSubmit()" id="authSubmitBtn" class="w-full bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2 rounded transition">
                    Giriş Yap
                </button>

                <!-- Mod Geçiş Linkleri -->
                <div class="flex justify-between text-sm mt-4">
                    <button onclick="toggleAuthMode('login')" class="text-gray-400 hover:text-white underline">Giriş Yap</button>
                    <button onclick="toggleAuthMode('register')" class="text-gray-400 hover:text-white underline">Kayıt Ol</button>
                    <button onclick="toggleAuthMode('forgot')" class="text-gray-400 hover:text-white underline">Şifremi Unuttum</button>
                </div>
            </div>
        </div>

        <!-- 2. OYUN EKRANI (Giriş Yapınca Görünür) -->
        <div id="gameContainer" class="hidden text-center w-full max-w-2xl bg-gray-800 p-8 rounded-xl shadow-lg">
            <h2 class="text-3xl font-bold mb-4 text-yellow-400">Rulet Masasına Hoş Geldiniz!</h2>
            <p class="text-gray-400 mb-6">Bahis miktarınızı seçin ve döndürün!</p>
            
            <!-- Sonuç Gösterge Alanı -->
            <div id="gameResult" class="text-2xl font-bold mb-6 text-yellow-300">Bir bahis seçin ve çevirin</div>

            <!-- Bahis ve Çevirme Kontrolleri -->
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Bahis Miktarı (TL)</label>
                    <input type="number" id="betAmount" value="100" class="w-32 bg-gray-700 border border-gray-600 rounded px-3 py-2 text-center text-white font-bold mx-auto">
                </div>

                <div class="flex justify-center gap-4">
                    <button onclick="playRoulette('red')" class="bg-red-600 hover:bg-red-700 px-6 py-3 rounded font-bold text-white transition">Kırmızıya Oyna</button>
                    <button onclick="playRoulette('black')" class="bg-gray-900 hover:bg-black border border-gray-700 px-6 py-3 rounded font-bold text-white transition">Siyaha Oyna</button>
                </div>
            </div>
        </div>

    </main>

    <!-- PARA YATIRMA MODALI -->
    <div id="depositModal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4">
        <div class="bg-gray-800 p-6 rounded-xl max-w-sm w-full shadow-xl">
            <h3 class="text-xl font-bold mb-4 text-yellow-400">Hesaba Para Yatır</h3>
            <p class="text-sm text-gray-400 mb-4">Yüklemek istediğiniz tutarı seçin veya yazın:</p>
            
            <div class="grid grid-cols-3 gap-2 mb-4">
                <button onclick="handleDeposit(100)" class="bg-gray-700 hover:bg-gray-600 py-2 rounded font-bold">+100 TL</button>
                <button onclick="handleDeposit(500)" class="bg-gray-700 hover:bg-gray-600 py-2 rounded font-bold">+500 TL</button>
                <button onclick="handleDeposit(1000)" class="bg-gray-700 hover:bg-gray-600 py-2 rounded font-bold">+1000 TL</button>
            </div>

            <input type="number" id="customDepositAmount" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 mb-4 text-white" placeholder="Özel tutar girin">
            
            <div class="flex justify-end gap-2">
                <button onclick="closeDepositModal()" class="bg-gray-600 hover:bg-gray-500 px-4 py-2 rounded text-sm">İptal</button>
                <button onclick="handleCustomDeposit()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded font-bold text-sm">Yatır</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT KODLARI -->
    <script>
        let currentAuthMode = 'login'; // 'login', 'register', 'forgot'
        let currentUsername = localStorage.getItem('username') || '';
        let balance = 0;

        // Sayfa yüklendiğinde oturum kontrolü
        window.addEventListener('DOMContentLoaded', () => {
            if (currentUsername) {
                checkUserSession();
            }
        });

        // Mod Değiştirme Fonksiyonu
        function toggleAuthMode(mode) {
            currentAuthMode = mode;
            const authTitle = document.getElementById('authTitle');
            const authSubmitBtn = document.getElementById('authSubmitBtn');
            const registerFields = document.getElementById('registerFields');

            if (mode === 'login') {
                authTitle.innerText = 'Giriş Yap';
                authSubmitBtn.innerText = 'Giriş Yap';
                registerFields.classList.add('hidden');
            } else if (mode === 'register') {
                authTitle.innerText = 'Kayıt Ol';
                authSubmitBtn.innerText = 'Kayıt Ol';
                registerFields.classList.remove('hidden');
            } else if (mode === 'forgot') {
                authTitle.innerText = 'Şifremi Unuttum';
                authSubmitBtn.innerText = 'Güvenlik Sorusunu Getir';
                registerFields.classList.add('hidden');
            }
        }

        // Ana İşlem Butonu (Giriş / Kayıt / Şifre Sıfırlama)
        async function handleAuthSubmit() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();

            if (!username) return alert('Kullanıcı adı boş olamaz!');

            // 1. GİRİŞ YAP
            if (currentAuthMode === 'login') {
                if (!password) return alert('Şifre boş olamaz!');
                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Giriş başarısız');

                    localStorage.setItem('username', data.username);
                    currentUsername = data.username;
                    alert('Giriş başarılı!');
                    location.reload();
                } catch (err) {
                    alert(err.message);
                }
            } 
            // 2. KAYIT OL
            else if (currentAuthMode === 'register') {
                if (!password) return alert('Şifre boş olamaz!');
                const securityQuestion = document.getElementById('secQuestion').value.trim();
                const securityAnswer = document.getElementById('secAnswer').value.trim();

                if (!securityQuestion || !securityAnswer) {
                    return alert('Lütfen güvenlik sorusu ve cevabını doldurun!');
                }

                try {
                    const res = await fetch('/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password, securityQuestion, securityAnswer })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Kayıt başarısız');

                    alert('Kayıt başarılı! Şimdi giriş yapabilirsiniz.');
                    toggleAuthMode('login');
                } catch (err) {
                    alert(err.message);
                }
            } 
            // 3. ŞİFREMİ UNUTTUM
            else if (currentAuthMode === 'forgot') {
                try {
                    const res = await fetch(`/api/get-security-question?username=${encodeURIComponent(username)}`);
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Kullanıcı bulunamadı');

                    const answer = prompt(`Güvenlik Sorusu: ${data.question}\nCevabınızı girin:`);
                    if (!answer) return;

                    const newPassword = prompt('Yeni şifrenizi girin:');
                    if (!newPassword) return;

                    const resetRes = await fetch('/api/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, answer, newPassword })
                    });
                    const resetData = await resetRes.json();
                    if (!resetRes.ok) throw new Error(resetData.error || 'Şifre sıfırlanamadı');

                    alert('Şifreniz başarıyla değiştirildi! Şimdi giriş yapabilirsiniz.');
                    toggleAuthMode('login');
                } catch (err) {
                    alert(err.message);
                }
            }
        }

        // Oturum Açıksa Arayüzü Düzenle
        async function checkUserSession() {
            try {
                const res = await fetch(`/api/user?username=${encodeURIComponent(currentUsername)}`);
                const data = await res.json();
                if (res.ok && data.user) {
                    balance = data.user.balance;
                    document.getElementById('usernameDisplay').innerText = currentUsername;
                    document.getElementById('userBalance').innerText = balance;
                    
                    document.getElementById('authContainer').classList.add('hidden');
                    document.getElementById('userMenu').classList.remove('hidden');
                    document.getElementById('gameContainer').classList.remove('hidden');
                }
            } catch (e) {
                console.error("Oturum kontrolü hatası:", e);
            }
        }

        // Çıkış Yap
        function handleLogout() {
            localStorage.removeItem('username');
            location.reload();
        }

        // Para Yatırma Modal İşlemleri
        function openDepositModal() {
            document.getElementById('depositModal').classList.remove('hidden');
        }

        function closeDepositModal() {
            document.getElementById('depositModal').classList.add('hidden');
        }

        async function handleDeposit(amount) {
            await sendDepositRequest(amount);
        }

        async function handleCustomDeposit() {
            const amount = Number(document.getElementById('customDepositAmount').value);
            if (!amount || amount <= 0) return alert('Geçerli bir tutar girin!');
            await sendDepositRequest(amount);
        }

        async function sendDepositRequest(amount) {
            try {
                const res = await fetch('/api/deposit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUsername, amount })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                balance = data.newBalance;
                document.getElementById('userBalance').innerText = balance;
                alert(data.message);
                closeDepositModal();
            } catch (err) {
                alert(err.message);
            }
        }

        // Rulet Oyunu Temel Mantığı
        function playRoulette(choice) {
            const betAmount = Number(document.getElementById('betAmount').value);
            if (!betAmount || betAmount <= 0) return alert('Geçerli bir bahis miktarı girin!');
            if (betAmount > balance) return alert('Bakiyeniz yetersiz!');

            // Basit simülasyon (Rastgele renk seçimi)
            const colors = ['red', 'black', 'red', 'black', 'green'];
            const winningColor = colors[Math.floor(Math.random() * colors.length)];
            
            const resultDiv = document.getElementById('gameResult');
            
            if (winningColor === choice) {
                balance += betAmount;
                resultDiv.innerText = `Tebrikler! Gelen renk: ${winningColor.toUpperCase()}. Kazandınız!`;
                resultDiv.className = "text-2xl font-bold mb-6 text-green-400";
            } else {
                balance -= betAmount;
                resultDiv.innerText = `Üzgünüm! Gelen renk: ${winningColor.toUpperCase()}. Kaybettiniz!`;
                resultDiv.className = "text-2xl font-bold mb-6 text-red-400";
            }

            document.getElementById('userBalance').innerText = balance;
            
            // Bakiyeyi arka planda sunucuya da güncelletmek istersen buraya ekleme yapabilirsin
        }
    </script>
</body>
</html>
