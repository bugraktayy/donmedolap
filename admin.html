<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Admin Paneli - Oyun Platformu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6">
    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Üst Menü -->
        <div class="flex justify-between items-center bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700">
            <h1 class="text-xl font-bold text-yellow-400">🛡️ Yönetici (Admin) Paneli</h1>
            <a href="/" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-sm font-bold transition">← Oyun Paneline Dön</a>
        </div>

        <!-- Yatırım Onayları Bölümü -->
        <div class="bg-gray-800 border border-gray-700 p-6 rounded-xl shadow-lg">
            <h3 class="text-lg font-bold text-yellow-400 mb-4">💳 Bekleyen Yatırım Talepleri</h3>
            <div id="depositsContainer" class="space-y-3">
                <div class="text-gray-500 text-center py-4">Bekleyen yatırım talebi yok.</div>
            </div>
        </div>

        <!-- Kullanıcı Listesi ve Bakiye Yönetimi -->
        <div class="bg-gray-800 border border-gray-700 p-6 rounded-xl shadow-lg">
            <h3 class="text-lg font-bold text-yellow-400 mb-4">👥 Kayıtlı Kullanıcılar</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-300">
                    <thead class="bg-gray-900 text-xs uppercase text-gray-400">
                        <tr>
                            <th class="p-3">Kullanıcı Adı</th>
                            <th class="p-3">Bakiye</th>
                            <th class="p-3 text-right">İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="3" class="text-center py-4 text-gray-500">Yükleniyor...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Sistem Logları ve İşlem Geçmişi -->
        <div class="bg-gray-800 border border-gray-700 p-6 rounded-xl shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-yellow-400">📜 Sistem Logları ve İşlem Geçmişi</h3>
                <button onclick="fetchAdminLogs()" class="bg-gray-700 hover:bg-gray-600 text-xs px-3 py-1.5 rounded-lg text-white font-bold transition">Yenile</button>
            </div>
            
            <div class="bg-gray-900 border border-gray-700 rounded-lg p-4 h-64 overflow-y-auto space-y-2 text-xs font-mono" id="adminLogsContainer">
                <div class="text-gray-500 text-center py-4">Loglar yükleniyor...</div>
            </div>
        </div>

    </div>

    <script>
        async function fetchDeposits() {
            try {
                const res = await fetch('/api/admin/deposits');
                const data = await res.json();
                const container = document.getElementById('depositsContainer');
                
                const pending = data.deposits.filter(d => d.status === 'pending');
                if (pending.length === 0) {
                    container.innerHTML = '<div class="text-gray-500 text-center py-4">Bekleyen yatırım talebi yok.</div>';
                    return;
                }

                container.innerHTML = '';
                pending.forEach(dep => {
                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-center bg-gray-900 p-4 rounded-xl border border-gray-700';
                    div.innerHTML = `
                        <div>
                            <p class="text-sm font-bold text-white">${dep.username} <span class="text-xs text-gray-400">(${dep.senderName})</span></p>
                            <p class="text-green-400 font-bold text-base">${dep.amount} TL</p>
                            <p class="text-[10px] text-gray-500">${dep.date}</p>
                        </div>
                        <button onclick="approveDeposit('${dep.id}')" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg text-xs font-bold transition">Onayla & Bakiye Ekle</button>
                    `;
                    container.appendChild(div);
                });
            } catch (err) { console.error(err); }
        }

        async function approveDeposit(requestId) {
            try {
                const res = await fetch('/api/admin/deposit/approve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ requestId })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                alert(data.message);
                fetchDeposits();
                fetchUsers();
                fetchAdminLogs();
            } catch (err) { alert(err.message); }
        }

        async function fetchUsers() {
            try {
                const res = await fetch('/api/admin/users');
                const data = await res.json();
                const tbody = document.getElementById('usersTableBody');
                
                if (!res.ok || !data.users || data.users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center py-4 text-gray-500">Kullanıcı bulunamadı.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                data.users.forEach(u => {
                    const tr = document.createElement('tr');
                    tr.className = 'border-b border-gray-700';
                    tr.innerHTML = `
                        <td class="p-3 font-bold text-white">${u.username}</td>
                        <td class="p-3 text-green-400 font-bold">${u.balance} TL</td>
                        <td class="p-3 text-right space-x-2">
                            <button onclick="updateBalance('${u.username}')" class="bg-yellow-600 hover:bg-yellow-700 px-3 py-1 rounded text-xs font-bold transition">Bakiye Düzenle</button>
                            <button onclick="deleteUser('${u.username}')" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-xs font-bold transition">Sil</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) { console.error(err); }
        }

        async function updateBalance(username) {
            const newBal = prompt(`${username} için yeni bakiyeyi girin:`);
            if (newBal === null || isNaN(newBal)) return;

            try {
                const res = await fetch('/api/admin/update-balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, newBalance: Number(newBal) })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                alert('Bakiye güncellendi!');
                fetchUsers();
                fetchAdminLogs();
            } catch (err) { alert(err.message); }
        }

        async function deleteUser(username) {
            if (!confirm(`${username} adlı kullanıcıyı silmek istediğine emin misin?`)) return;

            try {
                const res = await fetch('/api/admin/delete-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                alert('Kullanıcı silindi!');
                fetchUsers();
                fetchAdminLogs();
            } catch (err) { alert(err.message); }
        }

        async function fetchAdminLogs() {
            try {
                const res = await fetch('/api/admin/logs');
                const data = await res.json();
                const container = document.getElementById('adminLogsContainer');
                
                if (!res.ok || !data.logs || data.logs.length === 0) {
                    container.innerHTML = '<div class="text-gray-500 text-center py-4">Henüz kayıtlı log bulunmuyor.</div>';
                    return;
                }

                container.innerHTML = '';
                data.logs.forEach(log => {
                    let colorClass = 'text-gray-300';
                    if (log.type === 'DEPOSIT') colorClass = 'text-green-400';
                    else if (log.type === 'GAME') colorClass = 'text-yellow-400';
                    else if (log.type === 'REGISTER') colorClass = 'text-blue-400';
                    else if (log.type === 'ADMIN') colorClass = 'text-purple-400';

                    const div = document.createElement('div');
                    div.className = `border-b border-gray-800 pb-1.5 flex justify-between items-center`;
                    div.innerHTML = `
                        <div>
                            <span class="text-gray-500">[${log.date}]</span> 
                            <span class="font-bold px-1.5 py-0.5 rounded bg-gray-800 text-[10px] text-gray-300">${log.type}</span> 
                            <span class="${colorClass}">${log.message}</span>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (err) { console.error('Loglar çekilemedi:', err); }
        }

        window.onload = () => {
            fetchDeposits();
            fetchUsers();
            fetchAdminLogs();
            setInterval(() => {
                fetchDeposits();
                fetchAdminLogs();
            }, 10000);
        };
    </script>
</body>
</html>
