<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Admin Paneli - Yönetim</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6">
    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Üst Başlık -->
        <div class="flex justify-between items-center bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700">
            <h1 class="text-2xl font-bold text-yellow-400">Yönetici Paneli</h1>
            <a href="/" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-bold transition">Ana Sayfaya Dön</a>
        </div>

        <!-- 1. Para Yatırma Talepleri Bölümü -->
        <div class="bg-gray-800 rounded-xl shadow-lg p-6 border border-gray-700">
            <h2 class="text-xl font-bold text-yellow-400 mb-4">Bekleyen Para Yatırma Talepleri</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-700 text-gray-400 text-sm">
                            <th class="p-3">Kullanıcı</th>
                            <th class="p-3">Tutar</th>
                            <th class="p-3">Tarih</th>
                            <th class="p-3">Durum</th>
                            <th class="p-3">İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="depositTableBody" class="text-sm">
                        <!-- Dinamik doldurulacak -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 2. Kullanıcılar Listesi ve Yönetimi Bölümü -->
        <div class="bg-gray-800 rounded-xl shadow-lg p-6 border border-gray-700">
            <h2 class="text-xl font-bold text-yellow-400 mb-4">Kayıtlı Kullanıcılar</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-700 text-gray-400 text-sm">
                            <th class="p-3">Kullanıcı Adı</th>
                            <th class="p-3">Bakiye</th>
                            <th class="p-3">İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="text-sm">
                        <!-- Dinamik doldurulacak -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Bakiye Düzenleme Modalı -->
    <div id="editModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-gray-800 border border-gray-700 p-6 rounded-xl w-96 shadow-2xl">
            <h3 class="text-lg font-bold text-yellow-400 mb-4">Kullanıcı Bakiyesi Düzenle</h3>
            <p class="text-sm text-gray-300 mb-2">Kullanıcı: <span id="modalUsername" class="font-bold text-white"></span></p>
            <input type="number" id="newBalanceInput" placeholder="Yeni Bakiye" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white mb-4 text-sm focus:outline-none focus:border-yellow-400">
            <div class="flex justify-end gap-2">
                <button onclick="closeEditModal()" class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded text-sm transition">İptal</button>
                <button onclick="saveNewBalance()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded text-sm font-bold transition">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        let selectedUser = '';

        // Para yatırma taleplerini getir
        async function fetchDeposits() {
            try {
                const res = await fetch('/api/admin/deposits');
                const data = await res.json();
                const tbody = document.getElementById('depositTableBody');
                tbody.innerHTML = '';

                if (!data.deposits || data.deposits.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">Bekleyen para yatırma talebi yok.</td></tr>`;
                    return;
                }

                data.deposits.forEach(dep => {
                    const tr = document.createElement('tr');
                    tr.className = 'border-b border-gray-700/50 hover:bg-gray-700/20';
                    tr.innerHTML = `
                        <td class="p-3 font-bold text-yellow-400">${dep.username}</td>
                        <td class="p-3 text-green-400 font-bold">${dep.amount} TL</td>
                        <td class="p-3 text-gray-400">${dep.date}</td>
                        <td class="p-3">
                            ${dep.status === 'pending' ? '<span class="text-yellow-500 font-bold">Bekliyor</span>' : '<span class="text-green-500 font-bold">Onaylandı</span>'}
                        </td>
                        <td class="p-3">
                            ${dep.status === 'pending' ? `<button onclick="approveDeposit('${dep.id}')" class="bg-green-600 hover:bg-green-700 px-3 py-1 rounded text-xs font-bold transition">Onayla</button>` : '<span class="text-gray-500">-</span>'}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Yatırma talepleri yüklenirken hata:", err);
            }
        }

        // Kullanıcıları getir
        async function fetchUsers() {
            try {
                const res = await fetch('/api/admin/users');
                const data = await res.json();
                const tbody = document.getElementById('userTableBody');
                tbody.innerHTML = '';

                if (!data.users || data.users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-500">Kayıtlı kullanıcı bulunamadı.</td></tr>`;
                    return;
                }

                data.users.forEach(u => {
                    const tr = document.createElement('tr');
                    tr.className = 'border-b border-gray-700/50 hover:bg-gray-700/20';
                    tr.innerHTML = `
                        <td class="p-3 font-bold text-yellow-400">${u.username}</td>
                        <td class="p-3 text-green-400 font-bold">${u.balance || 0} TL</td>
                        <td class="p-3 flex gap-2">
                            <button onclick="openEditModal('${u.username}', ${u.balance || 0})" class="bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded text-xs font-bold transition">Düzenle</button>
                            <button onclick="deleteUser('${u.username}')" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-xs font-bold transition">Sil</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Kullanıcılar yüklenirken hata:", err);
            }
        }

        // Yatırma talebini onayla
        async function approveDeposit(requestId) {
            if (!confirm('Bu yatırma talebini onaylamak ve kullanıcının bakiyesine eklemek istiyor musunuz?')) return;

            try {
                const res = await fetch('/api/admin/deposit/approve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ requestId })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                alert(data.message);
                fetchDeposits();
                fetchUsers();
            } catch (err) {
                alert(err.message);
            }
        }

        // Modal Fonksiyonları
        function openEditModal(username, currentBalance) {
            selectedUser = username;
            document.getElementById('modalUsername').innerText = username;
            document.getElementById('newBalanceInput').value = currentBalance;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        async function saveNewBalance() {
            const newBalance = Number(document.getElementById('newBalanceInput').value);
            if (isNaN(newBalance) || newBalance < 0) return alert('Geçerli bir bakiye girin!');

            try {
                const res = await fetch('/api/admin/update-balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: selectedUser, newBalance })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                alert('Bakiye başarıyla güncellendi!');
                closeEditModal();
                fetchUsers();
            } catch (err) {
                alert(err.message);
            }
        }

        // Kullanıcı Sil
        async function deleteUser(username) {
            if (!confirm(`"${username}" adlı kullanıcıyı silmek istediğinize emin misiniz?`)) return;

            try {
                const res = await fetch('/api/admin/delete-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                alert('Kullanıcı başarıyla silindi.');
                fetchUsers();
            } catch (err) {
                alert(err.message);
            }
        }

        // Sayfa açıldığında verileri otomatik yükle
        window.onload = () => {
            fetchDeposits();
            fetchUsers();
        };
    </script>
</body>
</html>
