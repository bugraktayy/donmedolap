<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-gray-800 p-4 rounded-xl shadow-lg">
            <h1 class="text-2xl font-bold text-yellow-400">Yönetici Paneli</h1>
            <a href="/" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm transition">Ana Sayfaya Dön</a>
        </header>

        <!-- Kullanıcı Listesi -->
        <div class="bg-gray-800 p-6 rounded-xl shadow-lg">
            <h2 class="text-xl font-bold mb-4 text-yellow-400">Kayıtlı Kullanıcılar</h2>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-700 text-gray-400">
                            <th class="p-3">Kullanıcı Adı</th>
                            <th class="p-3">Bakiye (TL)</th>
                            <th class="p-3">Güvenlik Sorusu</th>
                            <th class="p-3 text-right">İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <!-- JavaScript ile dolacak -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Bakiye Düzenleme Modalı -->
    <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4">
        <div class="bg-gray-800 p-6 rounded-xl max-w-sm w-full shadow-xl">
            <h3 class="text-xl font-bold mb-4 text-yellow-400">Bakiye Düzenle: <span id="modalUsername" class="text-white"></span></h3>
            <p class="text-sm text-gray-400 mb-4">Yeni bakiye miktarını girin:</p>
            
            <input type="number" id="newBalanceInput" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 mb-4 text-white font-bold" placeholder="Yeni bakiye">
            
            <div class="flex justify-end gap-2">
                <button onclick="closeEditModal()" class="bg-gray-600 hover:bg-gray-500 px-4 py-2 rounded text-sm">İptal</button>
                <button onclick="saveNewBalance()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded font-bold text-sm">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        let selectedUser = '';

        window.addEventListener('DOMContentLoaded', () => {
            fetchUsers();
        });

        async function fetchUsers() {
            try {
                const res = await fetch('/api/admin/users');
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                const tbody = document.getElementById('userTableBody');
                tbody.innerHTML = '';

                data.users.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.className = 'border-b border-gray-700/50 hover:bg-gray-700/30 transition';
                    tr.innerHTML = `
                        <td class="p-3 font-semibold">${user.username}</td>
                        <td class="p-3 text-green-400 font-bold">${user.balance} TL</td>
                        <td class="p-3 text-sm text-gray-400">${user.securityQuestion || 'Yok'}</td>
                        <td class="p-3 text-right space-x-2">
                            <button onclick="openEditModal('${user.username}', ${user.balance})" class="bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded text-xs font-bold transition">Bakiye Düzenle</button>
                            <button onclick="deleteUser('${user.username}')" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-xs font-bold transition">Sil</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                alert('Kullanıcılar yüklenirken hata oluştu: ' + err.message);
            }
        }

        function openEditModal(username, currentBalance) {
            selectedUser = username;
            document.getElementById('modalUsername').innerText = username;
            document.getElementById('newBalanceInput').value = currentBalance;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        async function saveNewBalance() {
            const newBalance = Number(document.getElementById('newBalanceInput').value);
            if (isNaN(newBalance) || newBalance < 0) return alert('Geçerli bir bakiye girin!');

            try {
                const res = await fetch('/api/admin/update-balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: selectedUser, newBalance })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                alert('Bakiye başarıyla güncellendi!');
                closeEditModal();
                fetchUsers();
            } catch (err) {
                alert(err.message);
            }
        }

        async function deleteUser(username) {
            if (!confirm(`"${username}" adlı kullanıcıyı silmek istediğinize emin misiniz?`)) return;

            try {
                const res = await fetch('/api/admin/delete-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                alert('Kullanıcı silindi.');
                fetchUsers();
            } catch (err) {
                alert(err.message);
            }
        }
    </script>
</body>
</html>
